# ===========================================================================
# Central experiment configuration. FULLY BUILT.
#
# Every tunable lives here, never hardcoded mid-function. This is what makes an
# experiment reproducible: the config IS the experiment. Change a number here,
# re-run, and the eval history tells you whether it helped.
# ===========================================================================

seed: 42

# --- The prediction target -------------------------------------------------
# We frame "underperformance" operationally on what Olist actually supports.
# See docs/problem-framing.md for the full reasoning. Start with the binary
# classification target; the regression target is a stretch.
target:
  task: classification          # classification | regression | ranking
  name: is_underperforming
  # A product is "underperforming" if its revenue is in the bottom quantile
  # WITHIN its category (so we compare like with like, not electronics vs pens).
  underperformance_quantile: 0.25
  min_orders_for_label: 5       # exclude ultra-cold products from the label

# --- Temporal split (leakage-safe; NEVER random-split time series) ---------
split:
  strategy: temporal
  time_column: order_purchase_timestamp
  train_end: "2018-03-31"
  valid_end: "2018-06-30"
  # everything after valid_end is the test set

# --- Feature engineering ---------------------------------------------------
features:
  target_encoding_smoothing: 20.0   # Bayesian smoothing for category encoders
  rolling_windows_days: [7, 30, 90]

# --- Model -----------------------------------------------------------------
model:
  type: lightgbm                # baseline | lightgbm
  handle_imbalance: scale_pos_weight   # none | scale_pos_weight | class_weight
  calibrate: true               # fit a calibration layer on a held-out calib fold
  holdout:                      # seeded product-level split; remainder is train
    test_fraction: 0.20         # touched exactly once, at the very end
    valid_fraction: 0.15        # early stopping + model comparison
    calib_fraction: 0.15        # calibration fold the GBDT never saw
  gbdt:
    n_estimators: 1000          # ceiling; early stopping picks the real count
    learning_rate: 0.05
    num_leaves: 15              # small-data setting (hundreds of rows)
    early_stopping_rounds: 100

tuning:
  enabled: false
  n_trials: 50
  timeout_seconds: 600
  metric: pr_auc                # optimize PR-AUC (better than AUC under imbalance)

# --- Evaluation ------------------------------------------------------------
evaluation:
  primary_metric: pr_auc
  report_metrics: [roc_auc, pr_auc, brier, ece, recall_at_k]
  recall_k_fraction: 0.10       # recall among the top 10% flagged

# --- Experimentation defaults ----------------------------------------------
experiment:
  alpha: 0.05
  power: 0.80
  baseline_conversion: 0.030    # example baseline rate for power calcs
  min_detectable_effect_rel: 0.05   # detect a 5% relative lift
